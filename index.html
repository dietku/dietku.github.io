<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DietKu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DietKu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff8fc0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;background:linear-gradient(160deg,#ffd3e6,#f2b8ff);overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#4a1d3f;font:600 16px system-ui,sans-serif;transition:opacity .3s}
#load img{width:96px;height:96px;border-radius:22px}
#load a{color:#7a1c5a}
</style>
</head>
<body>
<div id="load"><img src="icon-192.png" alt=""><div>Membuka DietKu…</div><a id="alt" hidden>Tak terbuka? Tekan sini</a></div>
<iframe id="app" title="DietKu" allow="camera; clipboard-write"></iframe>
<script>
{
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzqua79jXHwMnjChtxxU6ohvvjOuV1QvnI0yMt5Jdw-gAs5ZKq7NPrYUlLbdcbcSsXxkQ/exec';
  const f = document.getElementById('app'), l = document.getElementById('load'), a = document.getElementById('alt');
  a.href = APP_URL;
  f.onload = () => { l.style.opacity = 0; setTimeout(() => l.remove(), 300); };
  f.src = APP_URL;
  setTimeout(() => { a.hidden = false; }, 8000);

  // Auto log masuk: simpan login "Ingat saya" di page ini (storan kekal di iPhone),
  // dan hantar hanya kepada app DietKu dalam iframe (domain Google Apps Script).
  const KEY = 'dietku-login';
  const fromApp = o => { try { return /\.googleusercontent\.com$/.test(new URL(o).hostname); } catch (_) { return false; } };
  addEventListener('message', e => {
    const d = e.data;
    if (!fromApp(e.origin) || !d || typeof d.dietku !== 'string') return;
    if (d.dietku === 'hello') {
      let v = null; try { v = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (_) {}
      e.source.postMessage({ dietku: 'login', u: v && v.u, p: v && v.p }, e.origin);
    } else if (d.dietku === 'save' && typeof d.u === 'string' && typeof d.p === 'string' && d.u.length < 100 && d.p.length < 200) {
      try { localStorage.setItem(KEY, JSON.stringify({ u: d.u, p: d.p })); } catch (_) {}
    } else if (d.dietku === 'clear') {
      try { localStorage.removeItem(KEY); } catch (_) {}
    }
  });
}
</script>
</body>
</html>
